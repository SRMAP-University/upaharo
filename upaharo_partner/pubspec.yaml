name: upaharo_partner
description: Merchant + delivery partner app for Upaharo and Grooll.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  provider: ^6.1.4
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  geolocator: ^13.0.0
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.11.1
  google_maps_flutter_android: ^2.14.11
  google_maps_flutter_platform_interface: ^2.11.1
  url_launcher: ^6.3.1
  shorebird_code_push: ^2.0.7
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  flutter_ringtone_player: ^4.0.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#68C137"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/sounds/order_alert.mp3
    - assets/branding/app_icon.png
    - assets/branding/grooll_logo.png
