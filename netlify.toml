[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Never CDN-cache storefront APIs — each response depends on x-store / ?store=
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store, must-revalidate"
    Netlify-Vary = "header=x-store|query=store"
    Vary = "x-store"

# Daily reminders (UTC) — same schedule as former vercel.json cron
[functions."reminders-cron"]
  schedule = "0 3 * * *"
