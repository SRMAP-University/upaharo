# Sized for a 16 GB machine: an 8 GB heap lets the daemon grow into swap instead
# of collecting, which stalls assembleDebug for hours.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# Keep Flutter Gradle plugin on the legacy AGP DSL until plugins fully support AGP 9.
android.newDsl=false
android.builtInKotlin=false
